<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator3.css">
</head>
<body>
    
    <nav class="calculator">
        <input type="text" id="display" readonly>

        <div class="buttons">

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">A/C</button>

             <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">+</button>

             <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">-</button>

             <button>.</button>
            <button>0</button>
            <button class="equal">=</button>
            <button class="operator">*</button>
            <button class="operator">/</button>
        </div>

    </nav>
    <script src="calculator.js"></script>
</body>
</html>
